[package]
name = "nice-plug-vizia"
version = "0.1.0"
edition = "2024"
authors = ["George Atkinson <geom3trik@vizia.dev>"]
license = "MIT"
description = "An adapter to use VIZIA GUIs with nice-plug"

[workspace]
members = ["xtask", "examples/gain_gui"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug-core = "0.4.2"

vizia = "0.4"
vizia_core = "0.4"
vizia_input = "0.4"
vizia_reactive = "0.4"

baseview = { version = "0.4", features = ["opengl"] }
skia-safe = { version = "^0.93.1", features = ["gl"] }
gl = { version = "0.14" }
raw-window-handle = "0.6"
keyboard-types = "0.8"

crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
